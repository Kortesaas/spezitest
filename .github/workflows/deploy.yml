name: Deploy to production

# WHAT TRIGGERS A DEPLOY
#
#  * First time: run manually once (Actions -> "Deploy to production" -> Run
#    workflow) to adopt the ALREADY-LIVE production server. This uploads code
#    only and creates the "production-deployed" tag. It does not touch the
#    existing database, .env, or var/. See the "first (adoption) deploy" step.
#  * Automatically: after that, when the "CI" workflow finishes successfully for
#    a push to main. Migration-free releases go straight to production.
#  * Manually again: rollback (pick an older commit/tag in "ref") and releasing
#    a migration-bearing commit AFTER the owner has already applied and verified
#    the schema change manually ("migrations_ack" = true).
#
# This workflow has NO production database credentials and runs NO SQL or
# migration command. It never seeds, resets, or recreates the database and never
# writes .env or var/. If a release changes database/migrations/*.sql it stops
# before uploading anything; the production schema is changed only by the owner,
# by hand, through the approved Plesk process, BEFORE the code is deployed.
# See docs/CICD.md. Fresh-install-only setup is docs/DEPLOYMENT.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or tag to deploy. Empty = current main. Set an older known-good SHA/tag to roll back."
        required: false
        default: ""
      migrations_ack:
        description: "Only means: I have ALREADY applied and verified the production schema change manually. Allow CODE deployment. (The workflow runs no migrations.)"
        type: boolean
        required: false
        default: false

# Never run two production deploys at once; queue them instead of cancelling.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Default: no write access to anything.
permissions:
  contents: read

jobs:
  deploy:
    name: Build artifact and deploy over FTPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # contents:write is needed ONLY to force-update the lightweight
    # "production-deployed" marker tag after a successful upload. No other
    # write scope is granted; the job runs no SQL and holds no DB credentials.
    permissions:
      contents: write

    # Gate: auto path requires a green CI run on main. Manual path is trusted to
    # the operator (used for rollback / acknowledged migration releases).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Resolve ref to deploy
        id: pick
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [ -z "$REF" ]; then
            REF="${{ github.event.workflow_run.head_sha }}"
          fi
          if [ -z "$REF" ]; then
            REF="${{ github.ref }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Deploying ref: $REF"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.ref }}
          fetch-depth: 0

      - name: Detect database migrations new since the last production deploy
        id: mig
        run: |
          set -eu
          git fetch origin '+refs/tags/production-deployed:refs/tags/production-deployed' --force 2>/dev/null || true
          if git rev-parse -q --verify refs/tags/production-deployed >/dev/null; then
            echo "first=false" >> "$GITHUB_OUTPUT"
            # Same safety check every time: what migration files changed since
            # the commit last deployed to production.
            ADDED="$(git diff --name-only production-deployed HEAD -- 'database/migrations/*.sql' || true)"
          else
            # No baseline yet: this is the first (adoption) deploy against an
            # already-live server. There is nothing to diff against, so no
            # migration/seed requirement is implied - production DB, .env and
            # var/ are left exactly as they are. The baseline is set by the tag
            # this run creates; the diff check applies from the next deploy on.
            echo "first=true" >> "$GITHUB_OUTPUT"
            ADDED=""
          fi
          if [ -n "$ADDED" ] && [ "${{ inputs.migrations_ack }}" != "true" ]; then
            echo "held=true" >> "$GITHUB_OUTPUT"
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "added<<EOF"
            echo "$ADDED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: First (adoption) deploy must be run manually once
        if: steps.mig.outputs.first == 'true' && github.event_name == 'workflow_run'
        run: |
          {
            echo "## First CI/CD deploy — adopt the existing production server"
            echo ""
            echo "Production is **already live and initialized**. There is no"
            echo "\`production-deployed\` tag yet, so run this first deploy **manually**"
            echo "once. It only points the pipeline at the running server and uploads"
            echo "application code."
            echo ""
            echo "This deploy — now and on every future run — will **not**:"
            echo ""
            echo "- touch, seed, reset or recreate the production database"
            echo "- run migrations"
            echo "- import seed or legacy data"
            echo "- create or overwrite \`.env\` or \`var/\` (images, uploads, tile cache)"
            echo ""
            echo "### One-time setup"
            echo ""
            echo "1. Confirm the \`spezitest-deploy\` FTP account logs in **at the existing**"
            echo "   \`spezitest/\` application directory — the one that already contains"
            echo "   \`public/\`, \`src/\`, \`.env\` and \`var/\`."
            echo "2. Add the four deployment secrets \`DEPLOY_HOST\`, \`DEPLOY_PORT\`,"
            echo "   \`DEPLOY_USERNAME\`, \`DEPLOY_PASSWORD\` (docs/CICD.md section 2)."
            echo ""
            echo "### Then"
            echo ""
            echo "3. **Actions → Deploy to production → Run workflow**, branch \`main\`,"
            echo "   inputs left at their defaults."
            echo "4. The workflow uploads only the managed code directories"
            echo "   (\`public src config bin database vendor\`) plus \`composer.json\`,"
            echo "   \`composer.lock\`, \`README.md\`, \`.env.production.example\`, then"
            echo "   creates \`production-deployed\` on that commit."
            echo "5. After that, successful CI runs on \`main\` deploy automatically."
            echo ""
            echo "> Fresh-install setup for a **brand-new empty server** (DB/user"
            echo "> creation, migrations, seed import) is **docs/DEPLOYMENT.md** and"
            echo "> does **not** apply to this existing server."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::First CI/CD deploy is an adoption step - run it manually once (see job summary)."
          exit 1

      - name: Hold deploy - manual production schema operation required
        if: steps.mig.outputs.held == 'true'
        run: |
          {
            echo "## Deployment stopped: this release changes the database schema"
            echo ""
            echo "Nothing has been uploaded. GitHub Actions does not touch the"
            echo "production database - the owner applies schema changes by hand."
            echo ""
            echo "Changed migration files since the last deployed revision:"
            echo ""
            echo '```'
            echo "${{ steps.mig.outputs.added }}"
            echo '```'
            echo ""
            echo "### Owner, do this in order (Plesk / approved manual process, no SSH):"
            echo ""
            echo "1. **Create a production DB backup** - Plesk -> Backup Manager"
            echo "   (Databases) *and* phpMyAdmin -> Export the Spezitest DB to a file."
            echo "2. **Review and apply the migration(s)** through the approved process:"
            echo "   Plesk -> Scheduled Tasks -> Run now, one-off:"
            echo "   \`/opt/plesk/php/8.3/bin/php <app-root>/bin/migrate.php\`"
            echo "   (adjust the app-root path). Then disable the task."
            echo "3. **Verify the production database** - confirm the expected"
            echo "   \`Applied migration:\` line(s) and run the docs/DEPLOYMENT.md"
            echo "   section 10 checks that exercise the new schema."
            echo "4. **Only then**, re-run this workflow:"
            echo "   **Actions -> Deploy to production -> Run workflow**"
            echo "   * \`ref\` = \`${{ steps.pick.outputs.ref }}\`"
            echo "   * \`migrations_ack\` = **true**  (= \"schema already handled"
            echo "     manually; deploy the code\")"
            echo ""
            echo "See docs/CICD.md -> \"Database migrations\" and docs/DEPLOYMENT.md section 12."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Deployment stopped - release changes DB schema. Owner must apply and verify it manually first (see job summary)."
          exit 1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_mysql, fileinfo
          coverage: none
          tools: composer:v2

      - name: Build production artifact
        run: sh tools/build-release.sh

      - name: Unpack artifact into deploy-root/
        run: |
          set -eu
          mkdir deploy-root
          tar -xzf dist/spezitest-*.tar.gz -C deploy-root --strip-components=1
          ls -la deploy-root

      - name: Assert artifact is safe to ship
        run: |
          set -eu
          cd deploy-root
          fail() { echo "::error::$1"; exit 1; }

          # Required application code present.
          test -f public/index.php     || fail "public/index.php missing from artifact"
          test -f composer.json        || fail "composer.json missing from artifact"
          test -d vendor               || fail "vendor/ missing from artifact"
          test -f bin/migrate.php      || fail "bin/migrate.php missing from artifact"

          # No secrets / env files (only *.example is allowed).
          if find . -name '.env' -o \( -name '.env.*' ! -name '*.example' \) | grep -q .; then
            fail "artifact contains a real .env file"
          fi
          # No developer-only trees.
          for p in tests tools .git phpunit.xml.dist phpstan.neon.dist bin/legacy-import.php; do
            test ! -e "$p" || fail "artifact contains developer-only path: $p"
          done
          # var/ must ship only as empty writable dirs plus a README.
          if find var -type f ! -name 'README.txt' | grep -q .; then
            fail "artifact var/ contains files (must be empty writable dirs only)"
          fi
          echo "Artifact contents (top level):"
          ls -1
          echo "OK - artifact carries application code only."

      - name: Upload artifact for audit
        uses: actions/upload-artifact@v4
        with:
          name: spezitest-release-${{ github.run_id }}
          path: dist/spezitest-*.tar.gz
          retention-days: 14

      - name: Deploy over explicit FTPS (lftp, per-directory mirror)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          # lftp reads the password from this env var via --env-password, so it
          # is never written to the script file or a command line.
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          # Optional repo variable. Leave unset for strict certificate validation.
          DEPLOY_TLS_VERIFY: ${{ vars.DEPLOY_TLS_VERIFY }}
        run: |
          set -euo pipefail   # deliberately NOT set -x: never echo the password

          # --- Why earlier runs failed -----------------------------------
          # (1) A GitHub secret pasted through the UI often keeps a trailing
          #     newline/CR. Substituted into an lftp URL it became
          #     ftp://<host>\n:<port>; lftp split on the newline and ran the
          #     leftover ":<port>" as a command -> "Unknown command ':<port>'".
          # (2) lftp's "-f <file>" is a SEPARATE invocation mode: it cannot be
          #     combined with -u/--env-password/<site> on the same command line.
          #     "lftp -u ... --env-password <url> -f <script>" made lftp pass the
          #     trailing "-f" to the implicit open -> "open: invalid option -- 'f'".
          #
          # Fix for both: sanitise + character-whitelist host/port/user, put the
          # "open" command (with the URL built from those clean values) INSIDE the
          # script, and invoke lftp only as:  lftp --norc -f "$script".
          host="$(printf '%s' "${DEPLOY_HOST:-}"     | tr -d '[:space:]')"
          port="$(printf '%s' "${DEPLOY_PORT:-}"     | tr -d '[:space:]')"
          user="$(printf '%s' "${DEPLOY_USERNAME:-}" | tr -d '[:space:]')"
          : "${host:?DEPLOY_HOST secret is empty}"
          : "${port:?DEPLOY_PORT secret is empty}"
          : "${user:?DEPLOY_USERNAME secret is empty}"
          : "${LFTP_PASSWORD:?DEPLOY_PASSWORD secret is empty}"
          # Character whitelists: nothing here can carry an lftp command, a quote,
          # whitespace, or a newline into the generated script.
          case "$host" in *[!A-Za-z0-9.-]*)   echo "::error::DEPLOY_HOST has unexpected characters after trimming"; exit 1 ;; esac
          case "$port" in ''|*[!0-9]*)        echo "::error::DEPLOY_PORT must be numeric"; exit 1 ;; esac
          case "$user" in *[!A-Za-z0-9._@-]*) echo "::error::DEPLOY_USERNAME has unexpected characters after trimming"; exit 1 ;; esac

          command -v lftp >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq lftp; }

          verify="${DEPLOY_TLS_VERIFY:-true}"
          url="ftp://${host}:${port}"     # explicit FTPS is ftp:// + ssl-force, on port 21
          echo "Connecting over explicit FTPS on port ${port} (verify-certificate=${verify})"

          script="$(mktemp)"
          trap 'rm -f "$script"' EXIT
          # Script holds NO credentials; ephemeral runner-only file, removed on
          # exit. `set cmd:fail-exit yes` makes the first failed lftp command
          # abort the session with a non-zero exit; `set -e` then fails the step,
          # so UPLOAD_OK is never written and the marker-tag step never runs.
          {
            echo "set cmd:fail-exit yes"
            echo "set net:max-retries 2"
            echo "set net:timeout 20"
            echo "set net:reconnect-interval-base 5"
            echo "set ftp:ssl-force true"          # refuse a plaintext session
            echo "set ftp:ssl-protect-data true"
            echo "set ftp:ssl-protect-list true"
            echo "set ssl:verify-certificate ${verify}"
            # Connect here, in script mode. Password is taken from $LFTP_PASSWORD
            # by --env-password - it is never written to this file.
            echo "open -u \"${user}\" --env-password \"${url}\""
            # Connection + auth + TLS check before any transfer. 'pwd' forces the
            # control connection to open; it does not list or mirror the root.
            echo "pwd"
            echo "echo == FTPS session established; starting uploads =="
            # Managed code directories only: upload and prune stale files INSIDE
            # each named directory. The remote root is never listed or mirrored.
            for d in public src config bin database vendor; do
              echo "mirror -R --delete --no-perms --verbose --exclude-glob .DS_Store deploy-root/${d}/ ./${d}/"
            done
            # Individual top-level runtime files: upload only, never delete.
            for f in composer.json composer.lock README.md .env.production.example; do
              echo "put -O ./ deploy-root/${f}"
            done
            echo "echo == all uploads completed =="
            echo "bye"
          } > "$script"

          # Script-mode only: no host/user/site/password on the command line.
          lftp --norc -f "$script"

          echo "FTPS deploy finished."
          echo "UPLOAD_OK=1" >> "$GITHUB_ENV"   # gates the marker-tag step

      - name: Create or move the production-deployed marker tag
        # Only after the FTPS step signalled that every upload succeeded.
        if: success() && env.UPLOAD_OK == '1'
        run: |
          set -eu
          git config user.name  "spezitest-deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          # First (adoption) deploy creates the tag; later deploys move it.
          git tag -f production-deployed "${{ steps.pick.outputs.ref }}"
          git push -f origin refs/tags/production-deployed
          echo "production-deployed -> $(git rev-parse --short production-deployed)"

      - name: Deploy summary
        if: success() && env.UPLOAD_OK == '1'
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Ref deployed | \`${{ steps.pick.outputs.ref }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Transport | explicit FTPS (lftp, per-directory mirror) |"
            echo "| DB migrations | not run by CI/CD - see docs/CICD.md |"
            echo ""
            echo "Never overwritten on the server: \`.env\`, \`var/\` (uploads, legacy"
            echo "images, tile cache), and anything outside the six managed code dirs."
          } >> "$GITHUB_STEP_SUMMARY"
